- id: m-lerobot-ckpt-real
  tags: [imitation, mid, lerobot, checkpoints, physical]
  fixture: lerobot_act
  brief_from: lerobot-act-real-robot
  brief_file: act-real-arm-eval-test-brief.md
  prompt: "The SignalFlag brief in docs/signalflag/act-real-arm-eval-test-brief.md is approved. Let's work out the metrics."
  persona: |
    IL engineer. Each checkpoint gets 10 trials on the real arm; the operator logs success, time and notes.
    You want to pick the checkpoint to deploy and understand failure modes. Partial.
  expect:
    audience: ML engineer choosing a checkpoint
    bad_runs: ["the newest checkpoint (100000, 6/10) is worse than 080000 (8/10)", "failure modes only in free-text notes"]
