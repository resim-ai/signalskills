# signalflag-design-metrics eval cases. Each case starts from an APPROVED brief (onboard sections filled,
# Data profile onward pending), taken from an onboarding eval run of the same persona (`brief_from`) and
# committed into the fixture workspace. The agent designs the metrics; the simulated user answers.
# expect.bad_runs are faults planted in the fixture data: the plan must make each one fail/warn or raise an
# event, AND show it on a chart, AND point toward the cause.
# expect.max_test_metrics is a ceiling for this audience (the skill's own rule is 5–20).

- id: m-planner-pytest
  tags: [behavior, mid, pytest, regression]
  fixture: pytest_suite
  brief_from: pytest-planner-ci
  brief_file: planner-test-brief.md
  prompt: "The SignalFlag brief in docs/signalflag/planner-test-brief.md is approved. Let's work out the metrics."
  persona: |
    Planning engineer. Runs pytest locally and in GitHub Actions on every PR. When a test fails you want to
    see the numbers behind it: path length vs straight line, clearance, and how far from the limit. You
    look at one PR's results, and sometimes how a scenario trended over the last few weeks. Partial
    control: pick from options.
  expect:
    audience: engineer debugging a PR failure
    bad_runs: ["clutter fails both asserts: path 2.2× straight line (limit 1.2×), clearance 0.20 m (limit 0.25 m)"]
    must_show: [path ratio and clearance with margin to the existing assert thresholds, at least one per-test chart of the evidence, trend per scenario across PRs on a dashboard]
    open_items: [plan() returns only lengths and clearance, not the path: a path-vs-obstacles picture needs the planner to return waypoints (structure-runs), flagged rather than invented]
    max_test_metrics: 10
    traps: [new thresholds instead of the existing asserts, scalars only with no chart]

- id: m-perception-det
  tags: [perception, mid, json, checkpoints]
  fixture: perception_det
  brief_from: perception-det-checkpoints
  brief_file: det3d-checkpoint-eval-test-brief.md
  prompt: "The SignalFlag brief in docs/signalflag/det3d-checkpoint-eval-test-brief.md is approved. Let's work out the metrics."
  persona: |
    Perception ML engineer. Evaluates checkpoints every 5 epochs on day/night/rain splits. Your worry: night
    getting worse while day improves. You also look at per-class AP when something drops. Partial control.
  expect:
    audience: ML engineer tracking training
    bad_runs: ["night mAP falls after epoch 15 while day rises", "epoch 20 has no rain metrics file (eval OOM in eval.log)"]
    must_show: [mAP/NDS per split over epochs on a dashboard, per-class AP table or heatmap per split, a required presence check so a missing split fails loudly, gap or regression check between splits]
    max_test_metrics: 25
    traps: [averaging splits into one number, missing split silently skipped]

- id: m-loc-bench
  tags: [localization, senior, csv, regression]
  fixture: loc_bench
  brief_from: loc-ate-pr
  brief_file: loc-bench-test-brief.md
  prompt: "The SignalFlag brief in docs/signalflag/loc-bench-test-brief.md is approved. Let's work out the metrics."
  persona: |
    Senior localization engineer. bench.py + pytest assert ATE < 0.15 m and RPE < 0.05 m per sequence on
    every PR. You want to know which PR made which sequence worse, and when it fails, where along the
    trajectory the error grew. User-led on metric choice: you want ATE, RPE, error over time and the XY
    trajectory against ground truth; you decide.
  expect:
    audience: senior engineer, user-led
    bad_runs: ["test_rpe[yard_figure8] fails the RPE limit"]
    must_show: [ATE and RPE per sequence with margin to the asserted limits, error-over-time line, XY trajectory vs ground truth (custom chart), trend across PRs]
    python_metrics: [ATE/RPE need trajectory alignment (computed in Python at ingest, emitted as values + series)]
    max_test_metrics: 20
    traps: [trying to compute ATE in SQL, inventing thresholds instead of reading the asserts]

- id: m-field-loc-drift
  tags: [localization, mid, mcap, physical, data-first]
  fixture: field_mcap
  brief_from: loc-field-no-gt
  brief_file: field-localization-test-brief.md
  prompt: "The SignalFlag brief in docs/signalflag/field-localization-test-brief.md is approved. Let's work out the metrics."
  persona: |
    Localization engineer. Warehouse robots log one mcap per shift. No ground truth. You want to explore
    drift and relocalization jumps; you don't know thresholds yet. Agent-led.
  expect:
    audience: engineer exploring field data
    bad_runs: ["relocalization jumps in some shifts", "newer logs carry an extra match_score field (schema drift)"]
    must_show: [jump events with time and size, odom-vs-localization divergence over time, light summary per log, raw pose series emitted for later queries]
    max_test_metrics: 10
    traps: [block/warn gates when the user has no thresholds, wide topic that breaks on the new field]

