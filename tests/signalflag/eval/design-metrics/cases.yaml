- id: m-behavior-nightly
  tags: [testing, lead, json, regression, large]
  fixture: behavior_ci
  brief_from: behavior-nightly-400
  brief_file: behavior-nightly-test-brief.md
  prompt: "The SignalFlag brief in docs/signalflag/behavior-nightly-test-brief.md is approved. Let's work out the metrics."
  persona: |
    Test lead. ~400 scenarios nightly; you need regressions vs last night and a release block. Your
    engineers dig into individual scenarios; you look at the batch summary. Partial.
  expect:
    audience: test lead + engineers, large regression
    bad_runs: ["8 scenarios fail on low TTC, low route completion or hard braking (no collisions)"]
