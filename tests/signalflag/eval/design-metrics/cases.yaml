- id: m-field-uat
  tags: [real-pattern, testing, lead, mcap, physical, regression]
  fixture: field_uat
  brief_from: field-uat-manual-verdicts
  brief_file: field-uat-test-brief.md
  prompt: "The SignalFlag brief in docs/signalflag/field-uat-test-brief.md is approved. Let's work out the metrics."
  persona: |
    QA lead. Release acceptance on real robots; techs record manual pass/fail. You want objective numbers
    that back (or contradict) the manual verdict, per case, per release. Partial.
  expect:
    audience: QA lead comparing releases
    bad_runs: ["rc2 UAT-018 marked PASS manually but max cross-track 0.157 m exceeds the 15 cm criterion", "an rc1 row has no recording"]
    must_show: [manual verdict vs objective verdict side by side with disagreement flagged, per-case criterion metric with margin (from the case's written criterion), per-release pass table on a dashboard, missing-recording check]
    max_test_metrics: 8
    traps: [trusting the manual verdict only, thresholds not taken from the written case criteria]

- id: m-video-qa
  tags: [real-pattern, data, mid, video, data-first]
