- id: m-perc-debug
  tags: [perception, senior, mcap, regression, media]
  fixture: perception_cam
  brief_from: hand-written
  brief_file: perception-replay-test-brief.md
  prompt: "The SignalFlag brief in docs/signalflag/perception-replay-test-brief.md is approved. Let's work out the metrics."
  persona: |
    Senior perception engineer. After each release-candidate replay you debug: which classes, ranges and
    scenarios got worse, whether tracking broke, latency. You want to scrub to the frames where something was
    missed. You're fine with a lot of metrics if each tells you something different. Partial: pick from options.
  expect:
    audience: senior engineer debugging a perception stack
    bad_runs: ["recall collapses beyond 40 m in highway_merge_far", "night pedestrian recall 0.24 vs 0.98 by day (cars fine)", "16 ID switches + track flicker in crowded_loading_dock", "rain_crosswalk latency p95 126 ms over the 100 ms budget for 1.8 s with diagnostics WARN", "phantom pedestrian burst for 0.5 s in rain_crosswalk"]
    must_show: [annotated camera MP4 first (scrub to misses), per-class precision/recall with IoU matching (py), recall by range bin, recall over time, missed-object / false-positive events with frames at severity levels, tracking ID switches and flicker, latency p50/p95 vs budget + over time with the diagnostics timeline, per-scenario/per-class batch breakdown, per-class recall over builds]
    python_metrics: [matching against labels, recall by range, ID switches, flicker]
    max_test_metrics: 25
    traps: [one aggregate mAP, an event per missed frame (spam), GIF where scrubbing is needed, gating on invented limits]
  metrics_hint: [see must_show]

- id: m-perc-lead
  tags: [perception, lead, mcap, regression, media]
  fixture: perception_cam
  brief_from: hand-written
  brief_file: perception-replay-test-brief.md
  prompt: "The SignalFlag brief in docs/signalflag/perception-replay-test-brief.md is approved. Let's work out the metrics."
  persona: |
    Perception lead. You decide whether a stack build ships. You want a quick read: overall and per-scenario
    status, which scenarios regressed vs the last build, the trend over builds. Details are for your
    engineers. You'll just give a go.
  expect:
    audience: lead deciding a release
    bad_runs: ["night pedestrian recall collapse", "far-range recall collapse", "rain latency over budget"]
    must_show: [per-scenario verdict with the failing criterion named, headline scalars (recall, precision, p95 latency) per test, batch table of what regressed vs the last build, dashboard trend per class over builds, one short media per test, raw data emitted for engineers]
    max_test_metrics: 6
    traps: [20 engineer charts for a lead, no per-scenario status]
  metrics_hint: [see must_show]

- id: m-photo-set-eval
  tags: [perception, mid, images, experiments]
  fixture: image_set_eval
  brief_from: hand-written
  brief_file: detector-photo-eval-test-brief.md
  prompt: "The SignalFlag brief in docs/signalflag/detector-photo-eval-test-brief.md is approved. Let's work out the metrics."
  persona: |
    Perception ML engineer. Every new detector version gets evaluated on the labeled photo set. You want to
    know if the new version is better than the last, where it got better or worse (class, condition, object
    size, camera source), and which images to look at. Partial: pick from options.
  expect:
    audience: ML engineer comparing model versions (experiment tracking)
    bad_runs: ["det-v4.2 is better overall (mAP 0.65 -> 0.76) but regresses on fog (recall 0.71 -> 0.54) and on small objects (0.55 -> 0.35)", "8 images have label errors that show as the same high-score false positive under both versions"]
    must_show: [batch-level comparison per class / condition / size / source so a regression hidden by the overall gain is visible, a ranking or delta card between versions, per-image result with the image and boxes, worst-images table, a check or event for false positives repeated across versions (probable label errors), per-class recall over versions on a dashboard]
    python_metrics: [matching with eval.py's matcher, slicing by condition / size / source]
    max_test_metrics: 10
    traps: [only the overall mAP (hides the fog and small-object regression), blaming the model for label errors, 240 per-image charts nobody reads]
  metrics_hint: [see must_show]
